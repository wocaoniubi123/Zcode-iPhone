name: ZCodeShell
options:
  bundleIdPrefix: com.zcode.shell
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  projectFormat: xcode15_3  # runner 是 Xcode 15.4；XcodeGen 2.46 默认 xcode16_0(format 77) 它读不了
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"          # CI 出 unsigned IPA，装机时由 Sideloadly 重签
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  ZCodeShell:
    type: application
    platform: iOS
    sources:
      - path: ZCodeShell
    info:
      path: ZCodeShell/Info.plist
      properties:
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleDisplayName: ZCode
        CFBundleShortVersionString: "1.5.1"
        CFBundleVersion: "9"
        UILaunchScreen: {}               # 空字典即用系统默认启动屏，避免黑盒
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "扫描 ZCode 官方远程连接二维码"
        NSPhotoLibraryAddUsageDescription: "保存远程会话中的图片到相册"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"      # 仅 iPhone
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic

  ZCodeShellTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZCodeShellTests
    dependencies:
      - target: ZCodeShell

schemes:
  ZCodeShell:
    build:
      targets:
        ZCodeShell: all
        ZCodeShellTests: [test]
    test:
      targets:
        - ZCodeShellTests
